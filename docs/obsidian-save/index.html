<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>保存到 Obsidian · 跳转测试</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f6f4fb;color:#292238;padding:24px}
main{width:min(100%,440px);padding:30px 24px;background:white;border-radius:22px;box-shadow:0 12px 36px #40306016}
.logo{width:52px;height:52px;display:grid;place-items:center;background:#eee8ff;border-radius:15px;font-size:26px}
h1{font-size:22px;margin:18px 0 8px}p{color:#605971;line-height:1.75;font-size:15px}
.filename{padding:13px;border-radius:10px;background:#f6f4fa;overflow-wrap:anywhere;font-size:14px;color:#403357}
button{display:block;width:100%;padding:15px;margin:22px 0 10px;border:0;border-radius:12px;background:#7450c9;color:white;font-size:17px;font-weight:600}
small{display:block;color:#80778e;line-height:1.6;text-align:center}
footer{margin-top:22px;padding-top:18px;border-top:1px solid #eeeaf3;font-size:12px;color:#837991;line-height:1.75}
</style>
</head>
<body>
<main>
<div class="logo">📓</div>
<h1>正在打开 Obsidian…</h1>
<p>如果手机允许从网页启动 Obsidian，就会自动创建下面这篇测试笔记。</p>
<div class="filename" id="file">ChatGPT一键保存测试.md</div>
<button type="button" id="open">打开 Obsidian 并保存</button>
<small>没有自动跳转？点上面的按钮再试一次。</small>
<footer>这是纯静态测试页，不上传、不存储笔记内容，也不会请求第三方接口。链接中 # 后面的内容仅在浏览器本地解析。请勿用此测试页传递涉密资料。</footer>
</main>
<script>
(function(){
  'use strict';
  const p=new URLSearchParams(location.hash.replace(/^#/,''));
  const vault=p.get('vault')||'我的知识库';
  const file=p.get('file')||'ChatGPT一键保存测试-2026-10-16.md';
  const content=p.has('content')?p.get('content'):'# Obsidian 一键保存测试\n\nHello Obsidian！\n\n来自 ChatGPT 的 HTTPS 跳转测试。';
  document.getElementById('file').textContent=file;
  const u='obsidian://new?'+new URLSearchParams({vault,file,content}).toString();
  function openObsidian(){window.location.href=u}
  document.getElementById('open').addEventListener('click',openObsidian);
  setTimeout(openObsidian,700);
})();
</script>
</body>
</html>
